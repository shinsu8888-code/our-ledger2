name: Build APK

# GitHub에 코드를 올리면 APK를 자동으로 만들어 줍니다.
# 결과는 페이지 하단 Artifacts의 "couple-ledger-apk" 에서 내려받을 수 있어요.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Flutter 버전을 고정해서 앞으로도 같은 환경에서 빌드되게 함
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0

      - name: Create Android project files
        run: flutter create . --org com.example --project-name couple_ledger

      - name: Patch Android build config (compileSdk 37 + desugaring)
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle

          # 1) compileSdk 를 36 → 37 로 (최신 androidx.core 요구사항)
          if ! grep -q "compileSdk = 37" "$F"; then
            sed -i.bak -E 's/compileSdk ?= ?flutter\.compileSdkVersion/compileSdk = 37/' "$F"
          fi

          # 2) desugaring 켜기 — 반드시 compileOptions 블록 "안"에
          if ! grep -q "isCoreLibraryDesugaringEnabled" "$F"; then
            perl -0pi -e 's/compileOptions \{\n/compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n/' "$F"
          fi

          # 3) desugar 라이브러리 의존성 추가
          if ! grep -q "coreLibraryDesugaring(" "$F"; then
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n' >> "$F"
          fi

          echo "--- patched result ---"
          grep -n "compileSdk\|Desugaring\|desugar" "$F" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: couple-ledger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
