name: couple_ledger
description: "부부/커플 금전출납 가계부 - 수입/지출 기록, 카테고리 분석, 월간 보고서, 실시간 공유"
publish_to: "none"
version: 2.0.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  fl_chart: ^1.3.1
  intl: ^0.20.0
  shared_preferences: ^2.5.6
  share_plus: ^13.0.0
  path_provider: ^2.1.5
  file_picker: ^13.0.0
  csv: ^8.0.0
  flutter_local_notifications: ^23.0.0
  flutter_notification_listener: ^1.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
